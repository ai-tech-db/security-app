name: security_ui
description: Android security monitor dashboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_local_notifications: ^17.2.2
  path_provider: ^2.1.4
  dnsolve: ^3.0.0
  battery_optimization_helper: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/

  # Sezione obbligatoria per flutter build aar
  module:
    androidX: true
    androidPackage: com.aitechdb.security_ui
    iosBundleIdentifier: com.aitechdb.securityUi

dependency_overrides:
  vector_math: 2.3.0
  shared_preferences_android: 2.4.21
  flutter_plugin_android_lifecycle: 2.0.33
  path_provider_android: 2.2.22
  url_launcher_android: 6.3.28
  video_player_android: 2.9.4
  webview_flutter_android: 4.10.13
  camera_android_camerax: 0.7.1
  file_selector_android: 0.5.2+4
  image_picker_android: 0.8.13+14
